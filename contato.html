<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio">
    <meta name="author" content="Generation Brasil">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />
    <title>Contato</title>

    <link rel="stylesheet" href="./assets/css/style.css">

</head>

<body>

    <!-- Cabeçalho da Página (header) -->
    <header>

        <!-- Título do cabeçalho -->
        <h1>Thaís Campos Silva</h1>

        <!-- Menu de Navegação -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>

    </header>

    <!-- Seção Principal da Página (main) -->
    <main class="main_contato">

        <!-- Seção do Formulário -->
        <form action="#" method="submit" id="formulario">

            <label for="nome">Nome:</label>
            <input id="name" type="text" name="name" placeholder="Digite seu nome" />
            <span id="errNome"></span>

            <label for="email">Email:</label>
            <input id="email" type="text" name="email" placeholder="Digite seu email" />
            <span id="errEmail"></span>

            <label for="subject">Assunto:</label>
            <input id="subject" type="text" name="subject" placeholder="Digite o assunto da mensagem" />
            <span id="errSubject"></span>

            <label for="message">Mensagem:</label>
            <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>

            <button type="submit">Enviar</button>

        </form>


        <article class="article_mapa">

            <address>
                <p>São Paulo - SP</p>
                <p>Brasil</p>
            </address>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14610.770292885398!2d-46.70311974676029!3d-23.72267006242009!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce4f0af1a04015%3A0x2af9aa8bb031b42b!2sPrimavera%20Interlagos!5e0!3m2!1spt-BR!2sbr!4v1767814757192!5m2!1spt-BR!2sbr"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>

        </article>

    </main>

    <!-- Rodapé da Página (footer) -->
    <footer>

        <!-- Seção de Contato - Redes Sociais-->
        <section>

            <a href="https://www.linkedin.com/in/thais-campos-fullstack/">
                <img src="assets/img/linkedin.svg" alt="LinkedIn" />
            </a>

            <a href="https://github.com/Thais-Campos">
                <img src="assets/img/github.svg" alt="Github" />
            </a>

            <a href="">
                <img src="assets/img/instagram.svg" alt="Instagram" />
            </a>

        </section>

        <h3>
            Desenvolvido por Thaís Campos © 2026
        </h3>

    </footer>

    <script src="assets/js/script.js"></script>

</body>

</html>
