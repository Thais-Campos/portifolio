<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio">
    <meta name="author" content="Generation Brasil">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />
    <title>Contato</title>
</head>

<body>

    <!-- Cabeçalho da Página (header) -->
    <header>

        <!-- Título do cabeçalho -->
        <h1>Generation Brasil</h1>

        <!-- Menu de Navegação -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>

    </header>

    <!-- Seção Principal da Página (main) -->
    <main>


        <!-- Seção Principal da Página (main) -->
        <main>

            <!-- Seção do Formulário -->
            <form action="#" method="submit" id="formulario">

                <label for="nome">Nome:</label>
                <input id="name" type="text" name="name" placeholder="Digite seu nome" />
                <span id="errNome"></span>

                <label for="email">Email:</label>
                <input id="email" type="text" name="email" placeholder="Digite seu email" />
                <span id="errEmail"></span>

                <label for="subject">Assunto:</label>
                <input id="subject" type="text" name="subject" placeholder="Digite o assunto da mensagem" />
                <span id="errSubject"></span>

                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>

                <button type="submit">Enviar</button>

            </form>


            <article>

                <address>
                    <p>Rua Frei Mateus, 100</p>
                    <p>São Paulo - SP</p>
                </address>

                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3652.6402194141397!2d-46.69071932390951!3d-23.724538767608774!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce4f737af352ad%3A0x1ef675cf74ddf08d!2sR.%20Frei%20Mateus%20da%20Encarna%C3%A7%C3%A3o%20Pina%20-%20Jardim%20Colonial%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2004821-290!5e0!3m2!1spt-BR!2sbr!4v1767730163766!5m2!1spt-BR!2sbr"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>

            </article>

        </main>


    </main>

    <!-- Rodapé da Página (footer) -->
    <footer>

        <!-- Seção de Contato - Redes Sociais-->
        <section>

            <a href="">
                <img src="assets/img/linkedin.svg" alt="LinkedIn" />
            </a>

            <a href="">
                <img src="assets/img/github.svg" alt="Github" />
            </a>

            <a href="">
                <img src="assets/img/instagram.svg" alt="Instagram" />
            </a>

        </section>

        <h3>
            Feito com 🧡 por Generation Brasil - 2025
        </h3>

    </footer>

</body>

</html>
